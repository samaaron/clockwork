# CodeQL over Clockwork's C and C++: GitHub's own semantic analysis, run on
# every push and pull request and weekly, with its findings in the Security
# tab. A finding at error level fails the job here, so it is seen in the same
# place as a failing test rather than only on a page nobody is sent to.
#
# The build is Clockwork's own (manual build mode): the Linux native
# configure with the tests off, which compiles every source the analysis
# should see. Smoothie (JUCE), the vendored libraries, the plugin SDKs and the
# fetched dependencies are compiled with it and so are analysed too; their
# findings are their authors', and scripts/codeql-report.py sets them aside
# before the results are judged and uploaded (CodeQL's own paths-ignore does
# not reach a compiled language built by hand).

name: codeql

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, early: the query packs move under us

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql (c-cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libudev-dev libjack-jackd2-dev \
            libpipewire-0.3-dev

      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build --parallel 2

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
          output: codeql-results
          upload: false

      # Clockwork's own findings, in the log and the job summary; a failure for
      # one at error level, the same bar as a compiler error, and for a file
      # that does not show an analysis happened.
      - name: Report
        run: python3 scripts/codeql-report.py codeql-results/cpp.sarif codeql-results/clockwork.sarif

      # uploaded even when the report fails on a finding, so the Security tab
      # shows it too
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('codeql-results/clockwork.sarif') != ''
        with:
          sarif_file: codeql-results/clockwork.sarif
          category: "/language:c-cpp"
