# CodeQL over Clockwork's C and C++: GitHub's own semantic analysis, run on
# every push and pull request and weekly, with its findings in the Security
# tab. An alert at warning or error level that is still open fails the job,
# the bar -Werror sets for the compiler; a finding that stands by design is
# dismissed once, in the Security tab with its reason, and stays dismissed.
#
# The build is Clockwork's own (manual build mode): the Linux native
# configure with the tests off, which compiles every source the analysis
# should see. Smoothie (JUCE), the vendored libraries, the plugin SDKs and the
# fetched dependencies are compiled with it and so are analysed too; their
# findings are their authors', and scripts/codeql-report.py sets them aside
# before the results are uploaded (CodeQL's own paths-ignore does not reach a
# compiled language built by hand).

name: codeql

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, early: the query packs move under us

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql (c-cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libudev-dev libjack-jackd2-dev \
            libpipewire-0.3-dev

      - uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build --parallel 2

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
          output: codeql-results
          upload: false

      # Clockwork's own findings, in the log and the job summary, and the
      # trimmed file the upload sends; a failure for a file that does not show
      # an analysis happened.
      - name: Findings
        run: python3 scripts/codeql-report.py trim codeql-results/cpp.sarif codeql-results/clockwork.sarif

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codeql-results/clockwork.sarif
          category: "/language:c-cpp"
          wait-for-processing: true

      # Judged once GitHub has the alerts: open at warning or error fails,
      # dismissed stands.
      - name: Verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/codeql-report.py judge
