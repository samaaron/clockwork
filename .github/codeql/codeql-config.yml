# What CodeQL judges: Clockwork's own code. Smoothie (our JUCE fork), the
# vendored single-file libraries, the plugin SDKs and the fetched dependencies
# are analysed by being compiled, but their findings are their authors' and
# would bury ours: 345 of the first run's 443 alerts were theirs (2026-10-07).
name: clockwork
paths-ignore:
  - smoothie
  - src/vendor
  - plugins
  - build
