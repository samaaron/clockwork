# cargo-deny license gate. Every dependency must be permissively licensed, so
# that the commercial licence can be offered; the first-party crates are
# AGPL-3.0-or-later OR commercial, and are the only exceptions.
# Run: cargo deny --manifest-path rust/Cargo.toml check licenses
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
exceptions = [
    { crate = "clockwork-bridge-native", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-clock", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-gamepad", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-heap", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-midi", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-native", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-osc", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-osc-net", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-ports", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-ports-disk", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-schedule", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-scope", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-sinks", allow = ["AGPL-3.0-or-later"] },
    { crate = "clockwork-slots", allow = ["AGPL-3.0-or-later"] },
]

[bans]
# No crates excluded by name; the license allow-list above is the policy.

[advisories]
# License-focused check; advisories handled separately.
ignore = []
