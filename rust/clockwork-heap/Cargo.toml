[package]
name = "clockwork-heap"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later OR LicenseRef-Clockwork-Commercial"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]

# tests/constant_time.rs measures the thread's own CPU time, which a busy
# machine cannot inflate: clock_gettime(CLOCK_THREAD_CPUTIME_ID) on Unix,
# QueryThreadCycleTime on Windows. Both already in the lockfile.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[features]
default = ["std"]
std = []
