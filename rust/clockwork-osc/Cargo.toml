[package]
name = "clockwork-osc"
version = "0.1.0"
edition = "2021"
authors = ["Sam Aaron"]
description = "Shared helpers for the clockwork Rust subsystems and for guests: an OSC 1.0 codec that reads and writes in place with no allocation (all arg types, nested arrays, bundles), the timetag, and OSC-safe device-name normalisation. Used by clockwork-midi/-gamepad/-osc-net on both native and wasm targets."
# No GPL-derived code.
license = "AGPL-3.0-or-later OR LicenseRef-Clockwork-Commercial"

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = ["clockwork-fence/std"]

[dependencies]
clockwork-fence = { path = "../clockwork-fence", default-features = false }

[dev-dependencies]
clockwork-corpus = { path = "../clockwork-corpus" }
