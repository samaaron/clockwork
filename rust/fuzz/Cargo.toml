# SPDX-License-Identifier: AGPL-3.0-or-later OR LicenseRef-Clockwork-Commercial
# Copyright (c) 2026 Sam Aaron
#
# Fuzz targets for the Rust parsers that read bytes from outside the process:
# the OSC codec every network transport hands its datagrams to, the cue
# server's re-framing of what it receives, the framing of the TCP and Unix
# stream transports, the "/clockwork/schedule" wire form, the sample-file
# decoders, and the MIDI and gamepad subsystems' bytes from a port and from a
# client. Run with cargo-fuzz on nightly:
#
#   cargo +nightly fuzz run osc_packet --fuzz-dir rust/fuzz
#
# Its own workspace, so the main one (and cargo-deny's licence gate over it)
# never sees libfuzzer-sys or needs nightly.
[package]
name = "clockwork-fuzz"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later OR LicenseRef-Clockwork-Commercial"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
clockwork-osc = { path = "../clockwork-osc" }
clockwork-schedule = { path = "../clockwork-schedule", default-features = false, features = ["parse"] }
clockwork-audio-decode = { path = "../clockwork-audio-decode" }
clockwork-comms = { path = "../clockwork-comms" }
clockwork-osc-net = { path = "../clockwork-osc-net" }
clockwork-midi = { path = "../clockwork-midi" }
clockwork-gamepad = { path = "../clockwork-gamepad" }

[[bin]]
name = "osc_packet"
path = "fuzz_targets/osc_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schedule_parse"
path = "fuzz_targets/schedule_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audio_decode"
path = "fuzz_targets/audio_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stream_frames"
path = "fuzz_targets/stream_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cue_reframe"
path = "fuzz_targets/cue_reframe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "midi"
path = "fuzz_targets/midi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gamepad"
path = "fuzz_targets/gamepad.rs"
test = false
doc = false
bench = false

# As the main workspace: external/symphonia-bundle-flac/CLOCKWORK-CHANGES.md.
[patch.crates-io]
symphonia-bundle-flac = { path = "../../external/symphonia-bundle-flac" }
