[package]
name = "clockwork-taps"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later OR LicenseRef-Clockwork-Commercial"
publish = false
description = "ScopeOut2's shared-memory slot claim and release."

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
clockwork-fence = { path = "../clockwork-fence" }
# The arena's own table, where the tap region's geometry is read.
clockwork-abi = { path = "../clockwork-abi" }
# AtomicU64 everywhere, including 32-bit chips without 64-bit atomics
# (Xtensa): real atomics where the ISA has them, a critical section where it
# does not — which is only ever the device, where these counters are idle.
portable-atomic = { version = "1", features = ["fallback"] }
