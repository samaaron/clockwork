[package]
name = "clockwork-midi"
version = "0.1.0"
edition = "2021"
authors = ["Sam Aaron"]
description = "clockwork MIDI subsystem (midir-based): parse/encode, device registry, timestamped output, and the clock-in pulse feed. Beat and tempo are computed engine-side in ClockworkClock, and continuous clock generation is the engine's MidiClockOut. Compiles to a native staticlib and a wasm-bindgen module."
# No GPL-derived code: talks to the engine purely via the /clockwork/midi/* OSC
# schema.
license = "AGPL-3.0-or-later OR LicenseRef-Clockwork-Commercial"

[lints]
workspace = true

[lib]
# cdylib → wasm-bindgen module (web).
# rlib   → folded into the clockwork-native staticlib (the engine link) +
#          host unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Shared OSC codec + OSC-safe name normalisation (also used by clockwork-gamepad).
clockwork-osc = { path = "../clockwork-osc" }

[features]
default = []
# Windows: use midir's WinRT (Windows.Devices.Midi) backend instead of WinMM.
# Gives full-length device names (no WinMM 31-char truncation) and pairs with the
# WinRT DeviceWatcher used for hot-swap (see src/watcher.rs). Enabled for Windows
# builds by CMake (--features winrt).
winrt = ["midir/winrt"]

# midir provides the actual device IO on both targets (CoreMIDI/ALSA/WinMM/WinRT
# natively, Web MIDI on wasm). Vendored from a patched fork (adds webmidi
# `send_at`); the path is finalised to a submodule/vendor dir in the build-wiring
# step. Native target only for now; the wasm target is added with the web boundary.
# coremidi_send_timestamped: stamp outgoing CoreMIDI packets with the host time
# at send (instead of 0 = "now"). The receiver then gets a precise hardware
# timestamp, so the engine's pulse anchoring uses real pulse times rather than
# jittery callback-dispatch time — and it tightens our own clock-OUT too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = { path = "../../external/midir", features = ["coremidi_send_timestamped"] }

# Hot-swap watcher (src/watcher.rs) device-change sources, per OS. These reuse
# the same crates midir already depends on, so they add no new transitive trees.
[target.'cfg(windows)'.dependencies]
# The version midir (external/midir) requires, so one `windows` serves both.
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Devices_Midi",
    "Devices_Enumeration",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9.0"
# CFRunLoop pump for the hot-swap watcher's dedicated thread (src/watcher.rs).
# Already a transitive dep of coremidi, so no new tree — pinned to the same minor.
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = ">=0.9.0, <0.12"

# Integration tests reach midir directly to create virtual loopback ports.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
midir = { path = "../../external/midir" }

# Web boundary: the shared core is exposed to the main-thread JS MidiManager via
# wasm-bindgen (Web MIDI I/O is done in JS).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
