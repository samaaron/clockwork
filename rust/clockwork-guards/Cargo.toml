[package]
name = "clockwork-guards"
version = "0.1.0"
edition = "2021"
authors = ["Sam Aaron"]
rust-version = "1.85"
license = "AGPL-3.0-or-later OR LicenseRef-Clockwork-Commercial"
publish = false
description = "Checks over what Clockwork builds: every mutable variable with static storage, held to a list, read from the objects; every extern \"C\" function the panic fence alone, read from the sources. A development tool; never in the staticlib."

[lints]
workspace = true

[dependencies]
object = { version = "0.39", default-features = false, features = ["read_core", "archive", "elf", "macho", "coff", "std"] }
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit", "printing"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
