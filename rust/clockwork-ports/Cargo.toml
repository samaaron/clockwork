[package]
name = "clockwork-ports"
version = "0.1.0"
edition = "2021"
authors = ["Sam Aaron"]
license = "AGPL-3.0-or-later OR LicenseRef-Clockwork-Commercial"
publish = false
description = "The port substrate: frames crossing the audio-thread boundary on a stable slot, through an SPSC lock-free ring. Implements src/clockwork_ports.h. Knows nothing of disk, network or Link."

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# AtomicU64 everywhere, including 32-bit chips without 64-bit atomics
# (Xtensa): real atomics where the ISA has them, a critical section where it
# does not — which is only ever the device, where these counters are idle.
portable-atomic = { version = "1", features = ["fallback"] }
# The stable-slot table: a generation-tagged handle, one atomic word per slot,
# and closing without a lock on the read path. Shared with the event sinks,
# which want the identical rule for a different payload.
clockwork-slots = { path = "../clockwork-slots" }
