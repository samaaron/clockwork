[package]
name = "clockwork-osc-net"
version = "0.1.0"
edition = "2021"
authors = ["Sam Aaron"]
description = "clockwork OSC networking subsystem (std::net): the external OSC cue server (inbound → re-framed /external-osc-cue) and outbound user OSC. Native-only; C ABI in cpp/clockwork_osc.h. Replaces the Clockwork/BEAM OSC server and the JUCE OSC sockets."
# No GPL-derived code: talks to the engine purely via the /clockwork/osc/* +
# /external-osc-cue OSC schema.
license = "AGPL-3.0-or-later OR LicenseRef-Clockwork-Commercial"

[lints]
workspace = true

[lib]
# rlib → folded into the clockwork-native staticlib (the engine link) + host
# unit tests. No cdylib: UDP networking is native-only (no wasm target).
crate-type = ["rlib"]

[dependencies]
socket2 = "0.6.4"
# Complete OSC 1.0 codec (messages + bundles) + the shared C-ABI scaffolding.
clockwork-osc = { path = "../clockwork-osc" }
# Every line this crate logs goes through clockwork_log (see that crate).
clockwork-log = { path = "../clockwork-log" }

[dev-dependencies]
clockwork-corpus = { path = "../clockwork-corpus" }
