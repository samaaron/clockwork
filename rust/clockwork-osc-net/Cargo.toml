[package]
name = "clockwork-osc-net"
version = "0.1.0"
edition = "2021"
authors = ["Sam Aaron"]
description = "clockwork OSC networking subsystem (std::net): the external OSC cue server (inbound → re-framed /external-osc-cue) and outbound user OSC. Native-only; C ABI in cpp/clockwork_osc.h. Replaces the Clockwork/BEAM OSC server and the JUCE OSC sockets."
# No GPL-derived code: talks to the engine purely via the /clockwork/osc/* +
# /external-osc-cue OSC schema.
license = "AGPL-3.0-or-later OR LicenseRef-Clockwork-Commercial"

[lints]
workspace = true

[lib]
# rlib → folded into the clockwork-native staticlib (the engine link) + host
# unit tests. No cdylib: UDP networking is native-only (no wasm target).
crate-type = ["rlib"]

[dependencies]
socket2 = "0.6.4"
# Complete OSC 1.0 codec (messages + bundles) + the shared C-ABI scaffolding.
clockwork-osc = { path = "../clockwork-osc" }

# shm.rs (the cross-process SHM peer test client) maps the server's segment
# with shm_open/mmap; libc is already in the lockfile via socket2.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Named-pipe stream server (pipe.rs): CreateNamedPipeW + owner-only DACL.
# Win32_System_Memory: shm.rs maps the segment with OpenFileMapping/MapViewOfFile.
# Already in the workspace lockfile transitively (other subsystem backends).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
