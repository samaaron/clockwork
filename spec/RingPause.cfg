\* The pause and the stop: one writer and the reader, two writes, one
\* pauser pausing twice, a pause that may give up, a stop.
SPECIFICATION Spec
CONSTANTS
    Size = 4
    MaxLen = 2
    Writers = {w1}
    Pausers = {p1}
    MaxWrites = 2
    MaxPauses = 2
    Retains = FALSE
    Timeouts = TRUE
    Stops = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    OneWriter
    NothingTorn
    NothingDamaged
    InOrder
    NoHoles
    EmptyMeansEmpty
    PauseMeansPaused
PROPERTIES
    StopLeaves
    AllDelivered
