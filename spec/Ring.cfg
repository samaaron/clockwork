\* The ring and the reader's sleep: two writers and the reader on a ring of
\* four slots, three writes, nothing paused or stopped.
SPECIFICATION Spec
CONSTANTS
    Size = 4
    MaxLen = 2
    Writers = {w1, w2}
    Pausers = {}
    MaxWrites = 3
    MaxPauses = 0
    Retains = FALSE
    Timeouts = FALSE
    Stops = FALSE
CHECK_DEADLOCK FALSE
INVARIANTS
    OneWriter
    NothingTorn
    NothingDamaged
    InOrder
    NoHoles
    EmptyMeansEmpty
PROPERTIES
    AllDelivered
